spring:
  application:
    name: realtime-collab
  data:
    mongodb:
      uri: mongodb://localhost:27017/omada_test
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: non_null
  mapstruct:
    unmappedTargetPolicy: WARN
  redis:
    host: localhost
    port: 6379

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.data.mongodb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
